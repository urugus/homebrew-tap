name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.3"

      - name: Check Formula syntax
        run: ruby -c Formula/baseline.rb

  install:
    name: Install
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Register local tap
        run: brew tap urugus/tap "$GITHUB_WORKSPACE"

      - name: Trust Formula
        run: brew trust --formula urugus/tap/baseline

      - name: Install Formula
        run: brew install --formula urugus/tap/baseline

      - name: Smoke test
        run: baseline version

      - name: Brew test
        run: brew test urugus/tap/baseline
