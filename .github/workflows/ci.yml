name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - name: Check Formula syntax
        run: ruby -c Formula/baseline.rb

  install:
    name: Install
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Register local tap
        run: brew tap urugus/tap "$GITHUB_WORKSPACE"

      - name: Install Formula
        run: brew install baseline

      - name: Smoke test
        run: baseline version

      - name: Brew test
        run: brew test baseline
