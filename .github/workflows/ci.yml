name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Check Formula syntax
        run: ruby -c Formula/baseline.rb

  install:
    name: Install
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register local tap
        run: brew tap urugus/tap "$GITHUB_WORKSPACE"

      - name: Install Formula
        run: brew install baseline

      - name: Smoke test
        run: baseline version

      - name: Brew test
        run: brew test baseline
